services:
  - type: web
    name: doomhound
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOSTNAME
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: ARENA_API_KEY
        sync: false
      - key: DOOMHOUND_CONTRACT
        value: 0xE99ad8A718F16C4B97D6aB2DfD6c226072CA9dBb
      - key: DOOMHOUND_COMMUNITY_ID
        value: 4b326b82-46e7-4ac7-a34b-8e8d00913f0b
      - key: DOOMHOUND_OWNER_ID
        value: 50e801a6-0f7d-4ca9-a855-462f834f2900
      - key: DOOMHOUND_SUBJECT_ID
        value: 50e801a6-0f7d-4ca9-a855-462f834f2900
      - key: AVAX_RPC_URL
        value: https://api.avax.network/ext/bc/C/rpc
      - key: NFT_CONTRACT_ADDRESS
        value: "0x350661c692003cC9D8b350B88e5cc2Fd989E4DCb"
