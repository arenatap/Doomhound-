services:
  - type: web
    name: doomhound
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: bash start-render.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOSTNAME
        value: 0.0.0.0
      # Supabase PostgreSQL connection string — SET IN RENDER DASHBOARD
      - key: DATABASE_URL
        sync: false
      # Arena API key — SET IN RENDER DASHBOARD
      - key: ARENA_API_KEY
        sync: false
      - key: DOOMHOUND_CONTRACT
        sync: false
      - key: DOOMHOUND_SUBJECT_ID
        sync: false
      - key: AVAX_RPC_URL
        value: https://api.avax.network/ext/bc/C/rpc
