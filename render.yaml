services:
  - type: web
    name: doomhound
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npx prisma generate && npx prisma db push --accept-data-loss && npm run build
    startCommand: node .next/standalone/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: HOSTNAME
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
      - key: ARENA_API_KEY
        sync: false
      - key: DOOMHOUND_CONTRACT
        sync: false
      - key: DOOMHOUND_SUBJECT_ID
        sync: false
      - key: AVAX_RPC_URL
        value: https://api.avax.network/ext/bc/C/rpc
